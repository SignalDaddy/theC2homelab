# -- Site Configuration --
theme = "blowfish"
baseURL = "http://cailshomelab.com/"
defaultContentLanguage = "en"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
    [[related.indices]]
        name = "tags"
        weight = 100
    [[related.indices]]
        name = "categories"
        weight = 100
    [[related.indices]]
        name = "series"
        weight = 50
    [[related.indices]]
        name = "authors"
        weight = 20
    [[related.indices]]
        name = "date"
        weight = 10

[params]
  mainSections = ["blog"]
  summaryLength = 30

[module]
  [module.hugoVersion]
    extended = true
    min = "0.120.0"
    # We omit 'max' to avoid the Blowfish version warning on Arch
